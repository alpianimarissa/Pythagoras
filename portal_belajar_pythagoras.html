<script>
    // Web Audio Synthesizer untuk efek suara retro belajar
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let soundEnabled = true;

    function playSound(type) {
        if (!soundEnabled) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            if (type === 'click') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'correct') {
                osc.type = 'sine';
                const now = audioCtx.currentTime;
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
                osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
                osc.frequency.setValueAtTime(1046.50, now + 0.24); // C6
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start();
                osc.stop(now + 0.4);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            } else if (type === 'triumph') {
                osc.type = 'square';
                const now = audioCtx.currentTime;
                osc.frequency.setValueAtTime(261.63, now); // C4
                osc.frequency.setValueAtTime(329.63, now + 0.1); // E4
                osc.frequency.setValueAtTime(392.00, now + 0.2); // G4
                osc.frequency.setValueAtTime(523.25, now + 0.3); // C5
                osc.frequency.setValueAtTime(1046.50, now + 0.5); // C6
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.85);
                osc.start();
                osc.stop(now + 0.85);
            }
        } catch(e) { console.warn("Audio Context Error: ", e); }
    }
</script>

                                Pada segitiga siku-siku dengan sudut istimewa 30°, 60°, dan 90°, jika panjang sisi miring (hipotenusa) adalah $20\\text{ cm}$, berapakah panjang sisi terpendek yang berada di depan sudut 30°?
                            </p>
                        </div>
                        <div class="pt-2">
                            <p class="text-slate-800 font-bold mb-2">Pilih jawaban yang tepat:</p>
                            ${renderQuizOptions(31, ["10 cm", "10√3 cm", "5 cm"], "10 cm", 1)}
                        </div>
                    </div>
                `
            },

            // HALAMAN 33: LATIHAN SOAL 8 (HARD)
            {
                category: "7. LATIHAN SOAL (HARD)",
                title: "Latihan 8: Menghitung Jarak Dua Koordinat 📝",
                render: () => `
                    <div class="space-y-5 text-base sm:text-lg max-w-4xl mx-auto">
                        <div class="p-5 bg-indigo-50 border border-indigo-200 rounded-2xl space-y-2">
                            <h4 class="font-bold text-indigo-950 font-header text-lg sm:text-xl">🔥 Pertanyaan:</h4>
                            <p class="text-slate-800 font-semibold leading-relaxed">
                                Berapakah jarak terpendek antara titik koordinat Kartesius $A(2, 3)$ dan titik $B(8, 11)$?
                            </p>
                        </div>
                        <div class="pt-2">
                            <p class="text-slate-800 font-bold mb-2">Pilih jawaban yang tepat:</p>
                            ${renderQuizOptions(32, ["10 satuan", "12 satuan", "15 satuan"], "10 satuan", 1)}
                        </div>
                    </div>
                `
            },

            // HALAMAN 34: LATIHAN SOAL 9 (HARD)
            {
                category: "7. LATIHAN SOAL (HARD)",
                title: "Latihan 9: Tinggi Segitiga Selimut Limas 📝",
                render: () => `
                    <div class="space-y-5 text-base sm:text-lg max-w-4xl mx-auto">
                        <div class="p-5 bg-indigo-50 border border-indigo-200 rounded-2xl space-y-2">
                            <h4 class="font-bold text-indigo-950 font-header text-lg sm:text-xl">🔥 Pertanyaan:</h4>
                            <p class="text-slate-800 font-semibold leading-relaxed">
                                Sebuah limas tegak $T.ABCD$ dengan alas persegi memiliki panjang sisi alas $12\\text{ cm}$. Jika tinggi limas tersebut adalah $8\\text{ cm}$, hitunglah tinggi segitiga tegak selimut limas!
                            </p>
                        </div>
                        <div class="pt-2">
                            <p class="text-slate-800 font-bold mb-2">Pilih jawaban yang tepat:</p>
                            ${renderQuizOptions(33, ["10 cm", "11 cm", "12 cm"], "10 cm", 1)}
                        </div>
                    </div>
                `
            },

            // HALAMAN 35: LATIHAN SOAL 10 (HARD) - EVALUASI AKHIR
            {
                category: "7. LATIHAN SOAL (HARD)",
                title: "Latihan 10: Tantangan Aljabar Final 📝",
                render: () => `
                    <div class="space-y-5 text-base sm:text-lg max-w-4xl mx-auto">
                        <div class="p-5 bg-indigo-50 border border-indigo-200 rounded-2xl space-y-3">
                            <h4 class="font-bold text-indigo-950 font-header text-lg sm:text-xl">🔥 Pertanyaan Evaluasi Akhir:</h4>
                            <p class="text-slate-800 font-semibold leading-relaxed">
                                Panjang sisi-sisi sebuah segitiga siku-siku berturut-turut dinyatakan dalam variabel: $2x\\text{ cm}$, $(2x+2)\\text{ cm}$, dan sisi miring $(4x-2)\\text{ cm}$. Carilah nilai $x$ yang memenuhi!
                            </p>
                            <div class="pt-2">
                                ${renderQuizOptions(34, ["x = 3", "x = 4", "x = 5"], "x = 3", 1)}
                            </div>
                        </div>

                        <div class="bg-emerald-50 border border-emerald-200 p-5 rounded-2xl text-center space-y-1">
                            <p class="font-extrabold text-emerald-900 text-base sm:text-lg">🎉 Selamat! Anda telah menyelesaikan seluruh modul 35 halaman!</p>
                            <p class="text-sm sm:text-base text-emerald-700 font-medium">Terus latih pemahaman geometri ini!</p>
                        </div>
                    </div>
                `
            }
        ];

        function renderQuizOptions(slideIdx, options, correctOpt, points) {
            const state = slideStates[slideIdx];
            return `
                <div class="grid grid-cols-1 gap-3.5 mt-4">
                    ${options.map(opt => {
                        let btnStyle = "bg-slate-50 border-slate-200 text-slate-800 hover:bg-slate-100 hover:border-indigo-300";
                        if (state.answered) {
                            if (opt === correctOpt) {
                                btnStyle = "bg-emerald-100 border-emerald-400 text-emerald-900 font-bold";
                            } else if (state.answer === opt) {
                                btnStyle = "bg-rose-100 border-rose-400 text-rose-900 font-bold";
                            } else {
                                btnStyle = "bg-slate-50 border-slate-200 text-slate-400 opacity-60";
                            }
                        }
                        const disabled = state.answered ? 'disabled' : '';
                        const escapedOpt = opt.replace(/'/g, "\\'");
                        const escapedCorrect = correctOpt.replace(/'/g, "\\'");
                        return `
                            <button onclick="checkAnswer(${slideIdx}, '${escapedOpt}', '${escapedCorrect}', ${points})" ${disabled} 
                                class="p-4 rounded-xl border text-left text-base sm:text-lg transition-all flex items-center justify-between ${btnStyle}">
                                <span>${opt}</span>
                                ${state.answered && opt === correctOpt ? '<span class="text-emerald-600 font-bold">✓ Benar</span>' : ''}
                                ${state.answered && state.answer === opt && opt !== correctOpt ? '<span class="text-rose-600 font-bold">✕ Salah</span>' : ''}
                            </button>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function checkAnswer(slideIdx, selectedOpt, correctOpt, points) {
            if (slideStates[slideIdx].answered) return;
            
            const isCorrect = selectedOpt === correctOpt;
            slideStates[slideIdx].answered = true;
            slideStates[slideIdx].answer = selectedOpt;

            if (isCorrect) {
                playSound('correct');
                showAlert('Jawaban Tepat! 🎉', 'Luar biasa, pemahaman matematika kamu makin tajam!', 'success');
            } else {
                playSound('wrong');
                showAlert('Belum Tepat 💡', `Jawaban yang benar adalah: ${correctOpt}. Tetap semangat!`, 'error');
            }

            updateGlobalProgress();
            renderModule();
        }

        function showAlert(title, desc, type) {
            const box = document.getElementById('alertBox');
            const titleEl = document.getElementById('alertTitle');
            const descEl = document.getElementById('alertDesc');
            const iconContainer = document.getElementById('alertIconContainer');

            if (!box || !titleEl || !descEl || !iconContainer) return;

            titleEl.innerText = title;
            descEl.innerText = desc;

            if (type === 'success') {
                iconContainer.className = 'p-2 rounded-xl text-white bg-emerald-500';
                iconContainer.innerHTML = '✓';
            } else {
                iconContainer.className = 'p-2 rounded-xl text-white bg-rose-500';
                iconContainer.innerHTML = '✕';
            }

            box.classList.remove('translate-y-10', 'opacity-0', 'pointer-events-none');
            box.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                dismissAlert();
            }, 3500);
        }

        function dismissAlert() {
            const box = document.getElementById('alertBox');
            if (box) {
                box.classList.remove('translate-y-0', 'opacity-100');
                box.classList.add('translate-y-10', 'opacity-0', 'pointer-events-none');
            }
        }

        function updateGlobalProgress() {
            let answeredCount = 0;
            const totalQuizCount = 10;
            for (let i = 25; i < 35; i++) {
                if (slideStates[i] && slideStates[i].answered) {
                    answeredCount++;
                }
            }

            const counter = document.getElementById('globalProgressCounter');
            if (counter) counter.innerText = `${answeredCount} / ${totalQuizCount}`;

            const bar = document.getElementById('globalProgressBar');
            if (bar) {
                const percent = ((currentModuleIndex + 1) / modules.length) * 100;
                bar.style.width = `${percent}%`;
            }
        }

        function renderModule() {
            const mod = modules[currentModuleIndex];
            document.getElementById('slideCategory').innerText = mod.category;
            document.getElementById('slidePageIndicator').innerText = `Halaman ${currentModuleIndex + 1} dari ${modules.length}`;
            document.getElementById('pageProgressText').innerText = `Halaman ${currentModuleIndex + 1} / ${modules.length}`;

            const contentDiv = document.getElementById('moduleContent');
            contentDiv.innerHTML = mod.render();

            document.getElementById('btnPrev').disabled = (currentModuleIndex === 0);
            document.getElementById('btnNext').disabled = (currentModuleIndex === modules.length - 1);

            updateGlobalProgress();

            // Format formula matematika KaTeX
            if (window.renderMathInElement) {
                renderMathInElement(contentDiv, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ],
                    throwOnError: false
                });
            }
        }

        function nextModule() {
            if (currentModuleIndex < modules.length - 1) {
                currentModuleIndex++;
                playSound('click');
                renderModule();
            }
        }

        function prevModule() {
            if (currentModuleIndex > 0) {
                currentModuleIndex--;
                playSound('click');
                renderModule();
            }
        }

        window.onload = function() {
            renderModule();
        };
    </script>
</body>
</html>
